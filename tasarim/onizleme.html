<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eğitim Evi — Tasarım Önizlemesi</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { background: var(--zemin); }
  .onizleme { max-width: 1000px; margin: 0 auto; padding: 24px 18px 60px; }
  .bolum { margin-bottom: 46px; scroll-margin-top: 20px; }
  .bolum-baslik {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 2px solid var(--ana-acik);
  }
  .bolum-no {
    background: var(--ana); color: #fff; font-weight: 700; font-size: 13px;
    width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .bolum-baslik h2 { margin: 0; font-size: 19px; }
  .bolum-baslik .aciklama { font-size: 13px; color: var(--soluk); }
  .cerceve {
    background: var(--kart); border: 1.5px solid var(--cizgi);
    border-radius: 14px; padding: 20px; overflow: hidden;
  }
  .not { font-size: 12.5px; color: var(--soluk); margin-top: 10px; }
  .ust-baslik { text-align: center; margin-bottom: 34px; }
  .ust-baslik h1 { margin: 0 0 6px; font-size: 26px; }
  .ust-baslik p { margin: 0; color: var(--soluk); }

  /* --- giriş ekranı önizlemesi --- */
  .giris-onizleme { max-width: 430px; margin: 0 auto; }

  .tabs-yeni {
    display: flex;
    gap: 6px;
    background: var(--zemin);
    border: 1.5px solid var(--cizgi);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 22px;
  }
  .tab-yeni {
    flex: 1;
    border: 0;
    background: transparent;
    border-radius: 999px;
    padding: 11px 14px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--soluk);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .tab-yeni.secili {
    background: var(--kart);
    color: var(--ana);
    box-shadow: 0 1px 4px rgba(31,27,46,.12);
  }

  .btn.hap { border-radius: 999px; padding: 12px 30px; }

  .giris-alt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 18px;
  }

  /* --- günlük ders programı --- */
  .prog-ust {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .prog-ozet { font-size: 13.5px; color: var(--soluk); }

  .gun-gezgin {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--zemin);
    border: 1.5px solid var(--cizgi);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .gun-ok {
    border: 0;
    background: var(--kart);
    border: 1.5px solid var(--cizgi);
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13.5px;
    color: var(--yazi);
    cursor: pointer;
    white-space: nowrap;
  }
  .gun-ok:hover { border-color: var(--ana); color: var(--ana); }
  .gun-orta { text-align: center; flex: 1; min-width: 0; }
  .gun-buyuk {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: .2px;
  }
  .gun-kucuk { font-size: 12.5px; color: var(--soluk); margin-top: 2px; }

  .gun-noktalar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 12px 0 18px;
    flex-wrap: wrap;
  }
  .nokta {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--zemin);
    border: 1.5px solid var(--cizgi);
    color: var(--soluk);
  }
  .nokta.dolu { color: var(--ana-koyu); background: var(--ana-acik); border-color: var(--ana-cizgi); }
  .nokta.secili { background: var(--ana); border-color: var(--ana); color: #fff; }
  .nokta.bos { opacity: .5; }

  /* Sütunlar: ekran genişledikçe yayılır, daraldıkça alt alta iner */
  .ders-sutunlar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
    gap: 12px;
    align-items: stretch;
  }
  .ders-sutun {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--kart);
    border: 1.5px solid var(--cizgi);
    border-radius: 12px;
    padding: 13px 14px;
    min-height: 150px;
    text-align: left;
  }
  .sutun-basi {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--soluk);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sutun-saat {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13px;
    color: var(--ana);
    font-weight: 700;
    margin-top: 2px;
  }
  .sutun-ders {
    font-size: 15.5px;
    font-weight: 600;
    margin-top: 6px;
    overflow-wrap: anywhere;
  }
  .sutun-kisi { font-size: 12.5px; color: var(--soluk); overflow-wrap: anywhere; }
  .sutun-islem { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; }

  .ders-sutun.cakisma { border-color: var(--kirmizi); background: #fef2f2; }
  .sutun-uyari {
    font-size: 11.5px;
    color: var(--kirmizi);
    font-weight: 600;
    margin-top: 5px;
    overflow-wrap: anywhere;
  }

  .ders-sutun.simdi { border-color: var(--ana); box-shadow: 0 0 0 3px var(--ana-acik); }
  .simdi-etiket {
    background: var(--ana); color: #fff; border-radius: 999px;
    padding: 1px 7px; font-size: 10px; letter-spacing: 0;
  }

  .ders-sutun.bos-saat { background: var(--zemin); border-style: dashed; }
  .bos-yazi { color: var(--soluk); font-weight: 400; font-size: 14px; }

  .ders-sutun.ekle {
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-style: dashed;
    background: var(--zemin);
    cursor: pointer;
    font: inherit;
    color: var(--soluk);
  }
  .ders-sutun.ekle:hover { border-color: var(--ana); color: var(--ana); background: var(--ana-acik); }
  .ekle-arti { font-size: 26px; line-height: 1; }
  .ekle-yazi { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="onizleme">
