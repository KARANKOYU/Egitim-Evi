<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d62839">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<!-- Tema seçimi sayfa çizilmeden uygulanır; CSP satır içi betiğe izin vermez, o yüzden ayrı dosya. -->
<script src="/js/tema.js"></script>
<meta name="description" content="Eğitim Evi - okul, öğretmen, öğrenci ve veli için ödev, sınav ve ilerleme takip sistemi.">
<title>Eğitim Evi</title>
<!-- Gövde yazı tipi stilden önce inmeye başlasın; ilk çizimde yazı değişimi görünmesin. -->
<link rel="preload" href="/yazitipi/plex-sans-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/yazitipi/plex-sans-400-700-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/simge-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eğitim Evi">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/simge-192.png">
</head>
<body>

    <div class="tabs kayan-sekme" role="tablist">
      <button type="button" id="tabGiris" class="on" role="tab">Giriş Yap</button>
      <button type="button" id="tabKayit" role="tab">Hesap Aç</button>
      <span class="kayan-isaret" aria-hidden="true"></span>
    </div>

    <div id="authMesaj"></div>

    <!-- iki adımlı giriş: kod ekranı -->
    <div id="kodEkran" style="display:none">
      <div class="kod-baslik">
        <div class="kod-simge"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <h2>Giriş kodunu gir</h2>
        <p id="kodAciklama">Kodu gönderdik.</p>
      </div>
      <form id="formKod" autocomplete="one-time-code">
        <div class="field">
          <label for="kodGiris">6 haneli kod</label>
          <input type="text" id="kodGiris" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" spellcheck="false" class="kod-kutu"
                 placeholder="______" required>
        </div>
        <button type="submit" class="btn full">Doğrula ve gir</button>
      </form>
      <div class="kod-alt">
        <button type="button" class="baglanti" id="kodTekrar">Kodu tekrar gönder</button>
        <button type="button" class="baglanti" id="kodVazgec">← Geri dön</button>
      </div>
    </div>

<div id="modalKok"></div>

<script src="/js/app.js"></script>
</body>
</html>
